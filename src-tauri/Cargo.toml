[package]
name = "wirewise"
version = "1.1.0"
description = "Interactive real-time electrical installation modeler, circuit simulator, and code compliance planner (PEC 2017 & IEC 60364)."
authors = ["John Ray O. Dalida"]
license = "MIT"
repository = "https://github.com/jro-d/wirewise"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wirewise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
semver = "1"
tokio = { version = "1", features = ["time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
